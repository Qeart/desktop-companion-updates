name: Build and tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test Aurum.Tests/Aurum.Tests.csproj -c Release --disable-build-servers -m:1
      - run: dotnet build Aurum.App/Aurum.App.csproj -c Release --disable-build-servers -m:1
